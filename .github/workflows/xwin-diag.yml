name: xwin-diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          ch = json.load(urllib.request.urlopen('https://aka.ms/vs/17/release/channel'))
          item = next(i for i in ch['channelItems'] if i['id'] == 'Microsoft.VisualStudio.Manifests.VisualStudio')
          man = json.load(urllib.request.urlopen(item['payloads'][0]['url']))
          for p in man['packages']:
              if p['id'].startswith('Win11SDK') or p['id'].startswith('Win10SDK'):
                  print('==', p['id'], p.get('version'))
                  if '26100' in p['id'] or '22621' in p['id']:
                      for f in p.get('payloads', []):
                          print('   ', f['fileName'])
          PY
